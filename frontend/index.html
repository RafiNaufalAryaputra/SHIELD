<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard Monitoring Baterai</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <header class="py-3 mb-4 border-bottom">
      <div class="container d-flex flex-wrap justify-content-between align-items-center">
        <h1 class="h4 mb-0">Dashboard Monitoring Baterai</h1>
        <div>
          <button id="toggleSim" class="btn btn-sm btn-outline-primary">Mulai Simulasi</button>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="row g-3 mb-4">
        <div class="col-6 col-md-3">
          <div class="card p-3 metric">
            <div class="label">Tegangan (V)</div>
            <div id="voltage" class="value">--</div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="card p-3 metric">
            <div class="label">Arus (A)</div>
            <div id="current" class="value">--</div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="card p-3 metric">
            <div class="label">Suhu (°C)</div>
            <div id="temp" class="value">--</div>
          </div>
        </div>
        <div class="col-12 col-md-3">
          <div class="card p-3 metric">
            <div class="label">Capacity</div>
            <div class="value">
              <div class="d-flex align-items-center">
                <div id="capacityText" class="me-3">-- %</div>
                <div class="progress flex-fill" style="height:18px;">
                  <div id="capacityBar" class="progress-bar" role="progressbar" style="width:0%" aria-valuemin="0" aria-valuemax="100"></div>
                </div>
              </div>
              <div class="small text-muted mt-2">
                <div id="timeRemaining">Est. remaining: —</div>
                <div id="timeToFull">Est. to full (10A): —</div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="card p-3 mb-4">
        <h2 class="h6">Tegangan - Waktu</h2>
        <canvas id="voltageChart" height="120"></canvas>
      </section>

      <section class="card p-3 mb-4">
        <h2 class="h6">Log Terakhir</h2>
        <div id="log" class="log"></div>
      </section>
    </main>

    <script src="assets/app.js"></script>
  </body>
</html>
